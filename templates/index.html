<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The First Signal — v0.0001</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="terminal">
        <header>
            <div>
                <span class="eyebrow">THE FIRST SIGNAL</span>
                <h1>The Dawn of Connection</h1>
            </div>
            <span class="version">v0.0001</span>
        </header>

        <section class="network-field">
            <div class="computer" id="computer">
                <div class="led" id="led"></div>
                <div class="computer-icon">▣</div>
                <strong>COMPUTER</strong>
                <span id="status">OFFLINE</span>
            </div>
        </section>

        <section class="system-panel">
            <div class="panel-title">SYSTEM</div>
            <div class="row"><span>MAC ADDRESS</span><code>{{ game.mac }}</code></div>
            <div class="row"><span>POWER</span><strong id="power">OFF</strong></div>
        </section>

        <button id="powerButton" type="button">POWER ON</button>

        <footer>THE NETWORK BEGINS WITH YOU.</footer>
    </main>
    <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
